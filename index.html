<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoW Forever — Відлік до релізу</title>
  
  <!-- Шрифти в стилі Warcraft -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --wow-gold: #ffd100;
      --border-gold: #9e7938;
      --bg-dark: #0a0c10;
      --panel-bg: rgba(18, 22, 30, 0.95);
      
      /* Класові кольори WoW */
      --color-hunter: #aad372;
      --color-priest: #ffffff;
      --color-rogue: #fff468;
      --color-unknown: #8a93a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #06070a radial-gradient(circle at center, #171c26 0%, #06070a 100%);
      font-family: 'Inter', sans-serif;
      color: #ded1be;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* Головна картка-вікно */
    .wow-container {
      width: 100%;
      max-width: 820px;
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 25px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      padding: 2.5rem 1.5rem;
      text-align: center;
    }

    .top-crest {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      font-weight: 900;
      color: var(--wow-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 209, 0, 0.35);
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      color: #9e7938;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 0.3rem;
    }

    .release-badge {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.3rem 1rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(158, 121, 56, 0.4);
      border-radius: 20px;
      font-size: 0.8rem;
      color: #a4abb8;
    }

    /* Блок зворотного відліку */
    .countdown-wrap {
      margin: 2rem auto;
      max-width: 580px;
      background: #0d1016;
      border: 2px solid #3c3220;
      border-radius: 6px;
      padding: 1.2rem 1rem;
      box-shadow: inset 0 0 15px #000;
    }

    .countdown-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .time-unit {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .digit {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .unit-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--border-gold);
      letter-spacing: 1px;
      margin-top: 0.5rem;
    }

    .sep {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--border-gold);
      line-height: 1;
      padding-bottom: 1.2rem;
      user-select: none;
    }

    /* Розділювач */
    .divider-line {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2.2rem 0 1.5rem;
    }

    .divider-line span {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      color: var(--wow-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .divider-line::before,
    .divider-line::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #5e4c27, transparent);
    }

    /* Список гравців (Party) */
    .party-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8rem;
    }

    .player-card {
      background: #0e1117;
      border: 1px solid #2d261b;
      border-radius: 6px;
      padding: 1rem 0.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s ease;
    }

    .player-card:hover {
      transform: translateY(-3px);
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border: 2px solid var(--border-gold);
      border-radius: 4px;
      background: #161a23;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 0.6rem;
    }

    .player-name {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .player-class {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7b8390;
      margin-bottom: 0.6rem;
    }

    .player-comment {
      width: 100%;
      font-size: 0.72rem;
      background: #141822;
      border: 1px solid #222838;
      border-radius: 3px;
      padding: 0.35rem 0.2rem;
      color: #9ba3b2;
      line-height: 1.2;
    }

    /* Кольори за класами */
    .hunter-card .player-name { color: var(--color-hunter); }
    .hunter-card { border-top: 3px solid var(--color-hunter); }

    .priest-card .player-name { color: var(--color-priest); }
    .priest-card { border-top: 3px solid var(--color-priest); }

    .rogue-card .player-name  { color: var(--color-rogue); }
    .rogue-card  { border-top: 3px solid var(--color-rogue); }

    .undecided-card .player-name { color: var(--color-unknown); }
    .undecided-card { border-top: 3px dashed var(--color-unknown); }

    /* Підвал */
    footer {
      margin-top: 2.2rem;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: #554425;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Адаптивність під смартфони */
    @media (max-width: 650px) {
      .party-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .wow-container {
        padding: 1.8rem 1rem;
      }
    }
  </style>
</head>
<body>

  <main class="wow-container">
    <div class="top-crest">⚔️ 🛡️ ⚔️</div>
    <h1>World of Warcraft</h1>
    <p class="subtitle">WoW Forever Launch</p>
    <div class="release-badge">Реліз: 4 листопада 2026 року</div>

    <!-- Таймер -->
    <section class="countdown-wrap">
      <div class="countdown-grid" id="timer-box">
        <div class="time-unit">
          <span class="digit" id="days">--</span>
          <span class="unit-title">Днів</span>
        </div>
        <span class="sep">:</span>
        <div class="time-unit">
          <span class="digit" id="hours">--</span>
          <span class="unit-title">Годин</span>
        </div>
        <span class="sep">:</span>
        <div class="time-unit">
          <span class="digit" id="minutes">--</span>
          <span class="unit-title">Хвилин</span>
        </div>
        <span class="sep">:</span>
        <div class="time-unit">
          <span class="digit" id="seconds">--</span>
          <span class="unit-title">Секунд</span>
        </div>
      </div>
    </section>

    <!-- Склад групи -->
    <div class="divider-line">
      <span>Ready Check (4/5)</span>
    </div>

    <section class="party-grid">
      <!-- Макс -->
      <article class="player-card hunter-card">
        <div class="icon-box">🏹</div>
        <span class="player-name">Макс</span>
        <span class="player-class">Hunter</span>
        <div class="player-comment">Годує пета 🥩</div>
      </article>

      <!-- Ярко -->
      <article class="player-card priest-card">
        <div class="icon-box">✨</div>
        <span class="player-name">Ярко</span>
        <span class="player-class">Priest</span>
        <div class="player-comment">Бафає групу 🛡️</div>
      </article>

      <!-- Гена -->
      <article class="player-card rogue-card">
        <div class="icon-box">🗡️</div>
        <span class="player-name">Гена</span>
        <span class="player-class">Rogue</span>
        <div class="player-comment">Сидить у стелсі 👤</div>
      </article>

      <!-- Діма -->
      <article class="player-card undecided-card">
        <div class="icon-box">❓</div>
        <span class="player-name">Діма</span>
        <span class="player-class">Ще думає</span>
        <div class="player-comment">Читає гайди 📖</div>
      </article>
    </section>

    <footer>
      «You are not prepared!»
    </footer>
  </main>

  <script>
    // 4 листопада 2026, 23:00 (CET/UTC+1)
    const RELEASE_DATE = new Date("2026-11-04T23:00:00+01:00").getTime();

    function renderCountdown() {
      const now = new Date().getTime();
      const diff = RELEASE_DATE - now;

      if (diff <= 0) {
        document.getElementById("timer-box").innerHTML = `
          <div style="font-family: 'Cinzel', serif; font-size: 1.4rem; color: #ffd100; padding: 0.5rem;">
            ⚔️ СЕРВЕРИ ВІДКРИТО! В БІЙ! ⚔️
          </div>`;
        clearInterval(timer);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = String(days).padStart(2, "0");
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    renderCountdown();
    const timer = setInterval(renderCountdown, 1000);
  </script>
</body>
</html>
