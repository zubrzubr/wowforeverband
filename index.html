<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoW Forever — Official Countdown</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Marcellus&display=swap" rel="stylesheet">

  <style>
    :root {
      --wow-gold: #f8b700;
      --wow-gold-bright: #ffe894;
      --wow-gold-dark: #8f6a1e;
      --border-accent: rgba(248, 183, 0, 0.25);
      --bg-dark: #06070a;
      --card-bg: rgba(14, 18, 26, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(56, 38, 12, 0.35) 0%, rgba(6, 7, 10, 0.95) 75%),
        radial-gradient(circle at 50% 100%, rgba(16, 26, 42, 0.3) 0%, transparent 60%);
      font-family: 'Marcellus', serif;
      color: #ded1be;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Subtle ambient dark glow */
    body::before {
      content: "";
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(248, 183, 0, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .countdown-card {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border: 1px solid var(--border-accent);
      border-radius: 12px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.8),
        inset 0 0 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      position: relative;
    }

    /* Minimalist gold corner lines */
    .countdown-card::before,
    .countdown-card::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid var(--wow-gold);
      pointer-events: none;
    }
    .countdown-card::before {
      top: -1px;
      left: -1px;
      border-right: none;
      border-bottom: none;
      border-top-left-radius: 12px;
    }
    .countdown-card::after {
      bottom: -1px;
      right: -1px;
      border-left: none;
      border-top: none;
      border-bottom-right-radius: 12px;
    }

    .crest {
      font-size: 1.25rem;
      letter-spacing: 0.8rem;
      margin-bottom: 1.2rem;
      opacity: 0.85;
      text-indent: 0.8rem;
    }

    h1.title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 5.5vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff7dc 0%, #f8b700 50%, #9e6f15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 25px rgba(248, 183, 0, 0.25));
      line-height: 1.15;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: clamp(0.9rem, 2.2vw, 1.1rem);
      color: #9f8863;
      text-transform: uppercase;
      letter-spacing: 5px;
      margin-bottom: 2.5rem;
    }

    /* Minimalist Timer Grid */
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin: 1.5rem auto 2.5rem;
      max-width: 580px;
    }

    .time-cell {
      background: rgba(9, 12, 18, 0.6);
      border: 1px solid rgba(143, 106, 30, 0.35);
      border-radius: 8px;
      padding: 1.4rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .time-cell:hover {
      border-color: rgba(248, 183, 0, 0.6);
      transform: translateY(-2px);
    }

    .digits {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px rgba(248, 183, 0, 0.35);
    }

    .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: #8c7855;
      letter-spacing: 2px;
      margin-top: 0.6rem;
    }

    /* Release Date Info & Status */
    .release-info {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0.55rem 1.4rem;
      background: rgba(6, 8, 12, 0.65);
      border: 1px solid rgba(248, 183, 0, 0.2);
      border-radius: 30px;
      font-size: 0.85rem;
      color: #b8ac9a;
      letter-spacing: 1px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--wow-gold);
      box-shadow: 0 0 8px var(--wow-gold);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    footer {
      margin-top: 2.2rem;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      color: #635032;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    @media (max-width: 580px) {
      .countdown-card {
        padding: 2.5rem 1.25rem;
      }
      .timer-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }
      .time-cell {
        padding: 1rem 0.5rem;
      }
    }
  </style>
</head>
<body>

  <main class="countdown-card">
    <div class="crest">⚔ 🛡 ⚔</div>
    <h1 class="title">World of Warcraft</h1>
    <div class="subtitle">WoW Forever</div>

    <!-- Countdown Display -->
    <div class="timer-grid" id="timer-box">
      <div class="time-cell">
        <span class="digits" id="days">--</span>
        <span class="label">Днів</span>
      </div>
      <div class="time-cell">
        <span class="digits" id="hours">--</span>
        <span class="label">Годин</span>
      </div>
      <div class="time-cell">
        <span class="digits" id="minutes">--</span>
        <span class="label">Хвилин</span>
      </div>
      <div class="time-cell">
        <span class="digits" id="seconds">--</span>
        <span class="label">Секунд</span>
      </div>
    </div>

    <!-- Release Info -->
    <div class="release-info">
      <span class="dot"></span>
      <span>4 листопада 2026 • 23:00 CET</span>
    </div>

    <footer>
      You are not prepared!
    </footer>
  </main>

  <script>
    // 4 листопада 2026, 23:00 (CET / UTC+1)
    const RELEASE_DATE = new Date("2026-11-04T23:00:00+01:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = RELEASE_DATE - now;

      if (diff <= 0) {
        document.getElementById("timer-box").innerHTML = `
          <div style="grid-column: 1 / -1; font-family: 'Cinzel', serif; font-size: clamp(1.4rem, 4vw, 2rem); color: #f8b700; padding: 1.5rem; text-shadow: 0 0 25px rgba(248, 183, 0, 0.5);">
            ⚔️ СЕРВЕРИ ВІДКРИТО! ⚔️
          </div>`;
        clearInterval(timer);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = String(days).padStart(2, "0");
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();
    const timer = setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
